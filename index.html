<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#1B5E20" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- SEO Meta Tags -->
    <title>Custly CRM — Lightweight CRM for Small Teams</title>
    <meta name="description" content="Custly is a modern, lightweight CRM for small teams and growing businesses. Manage contacts, companies, deals, tasks, and notes in one clean interface. 14-day free trial, no credit card required." />
    <meta name="keywords" content="CRM, customer relationship management, small business CRM, sales pipeline, contact management, deal tracking, task management, lightweight CRM" />
    <meta name="author" content="Kainuo Innovision Tech" />
    <link rel="canonical" href="https://custlycrm.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://custlycrm.com" />
    <meta property="og:title" content="Custly CRM — Lightweight CRM for Small Teams" />
    <meta property="og:description" content="Manage contacts, companies, deals, tasks, and notes in one clean interface. 14-day free trial, no credit card required." />
    <meta property="og:image" content="https://custlycrm.com/logo.svg" />
    <meta property="og:site_name" content="Custly CRM" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Custly CRM — Lightweight CRM for Small Teams" />
    <meta name="twitter:description" content="Manage contacts, companies, deals, tasks, and notes in one clean interface. 14-day free trial, no credit card required." />
    <meta name="twitter:image" content="https://custlycrm.com/logo.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Custly CRM",
      "url": "https://custlycrm.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "A modern, lightweight CRM for small teams and growing businesses. Manage contacts, companies, deals, tasks, and notes.",
      "offers": [
        {
          "@type": "Offer",
          "price": "20",
          "priceCurrency": "USD",
          "name": "Monthly Plan",
          "url": "https://custlycrm.com/#/billing"
        },
        {
          "@type": "Offer",
          "price": "168",
          "priceCurrency": "USD",
          "name": "Yearly Plan",
          "url": "https://custlycrm.com/#/billing"
        },
        {
          "@type": "Offer",
          "price": "399",
          "priceCurrency": "USD",
          "name": "Lifetime Plan",
          "url": "https://custlycrm.com/#/billing"
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "Kainuo Innovision Tech",
        "url": "https://custlycrm.com"
      }
    }
    </script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      .loader-container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: #fafafa;
      }

      /* CSS Spinner from https://projects.lukehaas.me/css-loaders/ */

      .loader,
      .loader:before,
      .loader:after {
        border-radius: 50%;
      }

      .loader {
        color: #283593;
        font-size: 11px;
        text-indent: -99999em;
        margin: 55px auto;
        position: relative;
        width: 10em;
        height: 10em;
        box-shadow: inset 0 0 0 1em;
        -webkit-transform: translateZ(0);
        -ms-transform: translateZ(0);
        transform: translateZ(0);
      }

      .loader:before,
      .loader:after {
        position: absolute;
        content: "";
      }

      .loader:before {
        width: 5.2em;
        height: 10.2em;
        background: #fafafa;
        border-radius: 10.2em 0 0 10.2em;
        top: -0.1em;
        left: -0.1em;
        -webkit-transform-origin: 5.2em 5.1em;
        transform-origin: 5.2em 5.1em;
        -webkit-animation: load2 2s infinite ease 1.5s;
        animation: load2 2s infinite ease 1.5s;
      }

      .loader:after {
        width: 5.2em;
        height: 10.2em;
        background: #fafafa;
        border-radius: 0 10.2em 10.2em 0;
        top: -0.1em;
        left: 5.1em;
        -webkit-transform-origin: 0px 5.1em;
        transform-origin: 0px 5.1em;
        -webkit-animation: load2 2s infinite ease;
        animation: load2 2s infinite ease;
      }

      @-webkit-keyframes load2 {
        0% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }

      @keyframes load2 {
        0% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader-container">
        <div class="loader">Loading...</div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="<%= mainScript %>"></script>
  </body>
</html>
